name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      # 工作区版本一致性闸门。
      # 工作区内的本地依赖解析不校验版本号（写错版本也能构建通过），
      # 因此 lockstep 只能靠 `cjpm ws check` 兜住——见
      # docs/plans/2026-09-27-workspace-modularization.md §5.2。
      - name: Install cjpm-ws
        run: cjpm install ystyle::cjpm_ws-0.1.5 --name cjpm-ws

      - name: Workspace version gate
        run: cjpm ws check

      - name: Build
        run: cjpm build

      - name: Test
        run: cjpm test --no-progress
