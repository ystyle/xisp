name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          # 与本地开发环境一致（工作区规范：从 2026-10-10 起统一 1.2.0）。
          # CI 长期停在 1.1.0 意味着验证的不是实际构建环境。
          version: 1.2.0
          components: stdx

      # setup-cangjie 导出的是 CANGJIE_STDX_PATH_STATIC / _DYNAMIC，而 cjpm 的
      # `bin-dependencies` 里按 cjvs 的约定写 `${CANGJIE_STDX_PATH}`（本仓 xisp_net
      # 与发布工具 cjpm_ws 都这么写）。两者不一致时变量展开成空，报错是：
      #   imports package 'stdx.xxx' ... but it is not added as a dependency in cjpm.toml
      # —— 指向完全错误的方向（看起来像 cjpm.toml 漏了依赖，实际是环境变量没映射）。
      # 所以这里统一映射一次，且必须排在所有依赖 stdx 的步骤之前。
      - name: Setup stdx env
        run: |
          base="${CANGJIE_STDX_PATH_STATIC:-${CANGJIE_STDX_PATH:-}}"
          if [ -z "$base" ]; then
            echo "::error::找不到 stdx 路径（CANGJIE_STDX_PATH_STATIC 与 CANGJIE_STDX_PATH 都为空）。确认 setup-cangjie 带了 components: stdx。"
            exit 1
          fi
          # 布局因安装方式而异：cjvs 是 <...>/static/stdx，setup-cangjie 是 <...>/static
          if [ -d "$base/stdx" ]; then
            stdx_path="$base/stdx"
          else
            stdx_path="$base"
          fi
          if [ ! -f "$stdx_path/libstdx.a" ] && [ ! -f "$stdx_path/libstdx.so" ]; then
            echo "::warning::$stdx_path 下没找到 libstdx.*，仍按此路径继续；若构建失败请先看这里。"
          fi
          echo "CANGJIE_STDX_PATH=$stdx_path" >> "$GITHUB_ENV"
          echo "stdx 路径: $stdx_path"

      # 工作区版本一致性闸门。
      # 工作区内的本地依赖解析不校验版本号（写错版本也能构建通过），
      # 因此 lockstep 只能靠 `cjpm ws check` 兜住——见
      # docs/plans/2026-09-27-workspace-modularization.md §5.2。
      - name: Install cjpm-ws
        run: cjpm install ystyle::cjpm_ws-0.1.5 --name cjpm-ws

      - name: Workspace version gate
        run: cjpm ws check

      # 成员配置闸门：`cjpm ws check` 只管版本 lockstep，管不到制品范围与
      # 发布元数据。这几类问题只在发版时才爆（0.4.0 的制品把整个 docs-site
      # 打了进去），到那时已经不可逆 —— 前置到 CI。
      - name: Member config gate
        run: bash scripts/check-members.sh

      - name: Build
        run: cjpm build

      - name: Test
        run: cjpm test --no-progress

      # 三模式（AST / 字节码 / JIT）examples 一致性闸门。
      #
      # 这个脚本靠二进制路径找 CLI；工作区化（阶段 1）把包名从 xisp 改成
      # xisp_cli 后路径失配，脚本静默退出码 2，此后半年未被实际执行。
      # 进 CI 是防止它再次"看起来存在、其实没跑"。
      - name: Examples 三模式一致性
        run: bash lisp-tests/check-examples.sh
