[package]
  cjc-version = "1.0.0"
  name = "xisp_examples"
  organization = "ystyle"
  description = "星枢仓颉侧示例（不发布）"
  version = "0.5.0"
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp"

[dependencies]
  "ystyle::xisp" = "0.5.0"
  "ystyle::xisp_repl" = "0.5.0"

[package.package-configuration."ystyle::xisp_examples.extension_demo"]
output-type = "executable"
compile-option = "--static"

