[package]
  cjc-version = "1.0.0"
  name = "xisp_cli"
  organization = "ystyle"
  description = "星枢命令行入口"
  version = "0.6.0"
  output-type = "executable"
  compile-option = "-O2 --static -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp"

[dependencies]
  "ystyle::xisp" = "0.6.0"
  "ystyle::xisp_repl" = "0.6.0"
  # 字节码 / JIT 选项（--with-bytecode-compiler / --with-jit）由后端模块提供
  "ystyle::xisp_bc" = "0.6.0"
